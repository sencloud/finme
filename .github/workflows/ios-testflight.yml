# =============================================================================
# iOS TestFlight 云端构建 + 上传 workflow
#
# 触发方式:
#   1) 手动 (Actions 页面点 Run workflow) —— 最常用
#   2) 给 commit 打形如 v0.1.0 / v0.1.1+2 的 tag 时自动触发
#
# 在 GitHub repo 的 Settings -> Secrets and variables -> Actions 必须配置:
#   - BUILD_CERTIFICATE_BASE64   Apple Distribution 证书 .p12 文件的 base64 文本
#   - P12_PASSWORD               导出 .p12 时设置的密码
#   - KEYCHAIN_PASSWORD          临时 keychain 解锁密码 (随便填一个长随机串)
#   - ASC_API_KEY_ID             App Store Connect API Key 的 Key ID
#   - ASC_API_ISSUER_ID          App Store Connect API Key 的 Issuer ID (UUID)
#   - ASC_API_KEY_BASE64         .p8 私钥文件的 base64 文本
# =============================================================================

name: iOS Build & TestFlight

on:
  # 手动触发,可在 Actions 页面点击 "Run workflow" 按钮。
  workflow_dispatch:

  # tag 形如 v0.1.0 时自动触发。后续打 tag 即可发布新版本。
  push:
    tags:
      - "v*"

# 防止并发跑两次造成 build number 冲突。
concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build IPA and upload to TestFlight
    # 关键: 必须显式指定 macos-26。
    # 截至 2026-05, GitHub 的 macos-latest 仍滞后 Apple 几个月, 默认是 macos-15 + Xcode 16.4,
    # 用它构建会被 App Store Connect 服务端拒绝, 报 "must be built with iOS 26 SDK or later"。
    # macos-26 的镜像默认 Xcode 26.4.1, 自带 iOS 26 SDK, 是当前 Apple 强制要求的最低版本。
    runs-on: macos-26
    timeout-minutes: 60

    defaults:
      run:
        # flutter_app 是子目录,所有命令默认进这里。
        working-directory: flutter_app

    steps:
      # ---------------------------------------------------------------
      # 1. 拉代码
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. 安装 Flutter
      #    fixed channel + 自动从 .metadata 读 SDK 版本; 也可以指定具体 version。
      # ---------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 如果想锁定 Flutter 版本,把下一行 cache 改成 version: '3.41.9'
          cache: true

      - name: Print Flutter & Xcode versions
        run: |
          flutter --version
          xcodebuild -version
          xcode-select -p

      # ---------------------------------------------------------------
      # 3. 拉 Dart 包依赖
      # ---------------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      # ---------------------------------------------------------------
      # 3.5 把 base64 编码的 .p8 解码回 PKCS8 PEM 原文。
      #     原因: apple-actions v3 的 api-private-key 输入要求是 PKCS8 PEM 原文
      #     (含 -----BEGIN PRIVATE KEY----- 和 -----END PRIVATE KEY-----),
      #     而我们把它存成 base64 是为了在 GitHub Secrets UI 里粘贴方便、避免换行问题。
      # ---------------------------------------------------------------
      - name: Decode App Store Connect API private key
        id: decode_asc_key
        shell: bash
        # 这一步在 flutter_app 子目录或仓库根目录跑都行,显式回到根目录避免歧义。
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          KEY_PEM="$(printf '%s' '${{ secrets.ASC_API_KEY_BASE64 }}' | base64 -d 2>/dev/null || true)"
          if [ -z "$KEY_PEM" ]; then
            echo "::error::ASC_API_KEY_BASE64 解码失败,请检查 GitHub Secret 是否粘贴正确(必须是 .p8 文件 base64 后的字符串,不能含 BEGIN/END 标签)"
            exit 1
          fi
          if ! printf '%s' "$KEY_PEM" | head -1 | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::解码后的内容不是合法的 PKCS8 PEM (缺少 BEGIN PRIVATE KEY 头)"
            exit 1
          fi
          # 把解码后的私钥也加到 mask 列表里,防止意外 echo 时泄露到日志。
          echo "::add-mask::$KEY_PEM"
          # 用 GITHUB_OUTPUT 的 heredoc 语法存多行字符串。
          {
            echo 'pem<<EOF_ASC_KEY'
            printf '%s\n' "$KEY_PEM"
            echo 'EOF_ASC_KEY'
          } >> "$GITHUB_OUTPUT"
          echo "ASC API Key 解码 OK"

      # ---------------------------------------------------------------
      # 4. 导入 Apple Distribution 证书到一个临时 keychain
      #    用社区维护的官方 action,会自动建临时 keychain、解锁、清理。
      # ---------------------------------------------------------------
      - name: Import code-signing certificate (.p12)
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      # ---------------------------------------------------------------
      # 5. 用 ASC API Key 自动从 Apple Developer 拉取 provisioning profile
      #    profile 名必须和 ExportOptions.plist 里的一致: "Finme Chanlun App Store"
      # ---------------------------------------------------------------
      - name: Download provisioning profile
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: com.finme.chanlun
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          api-private-key: ${{ steps.decode_asc_key.outputs.pem }}

      # ---------------------------------------------------------------
      # 6. 构建 IPA (Release 模式,使用 Manual signing + ExportOptions.plist)
      #    --build-number 用 GitHub Actions 自带的 run number 自动递增,避免上传冲突。
      # ---------------------------------------------------------------
      - name: Build IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-number=${{ github.run_number }}

      # ---------------------------------------------------------------
      # 7. 列出产物便于排错
      # ---------------------------------------------------------------
      - name: Show IPA info
        run: |
          ls -la build/ios/ipa/
          du -sh build/ios/ipa/*.ipa

      # ---------------------------------------------------------------
      # 8. 上传 IPA 到 TestFlight
      # ---------------------------------------------------------------
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: flutter_app/build/ios/ipa/finme_chanlun_app.ipa
          issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          # 同样使用解码后的 PEM 原文,而不是 base64
          api-private-key: ${{ steps.decode_asc_key.outputs.pem }}

      # ---------------------------------------------------------------
      # 9. 把 IPA 也作为 GitHub artifact 留存,方便事后下载分析
      # ---------------------------------------------------------------
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finme_chanlun_app-ipa-build${{ github.run_number }}
          path: flutter_app/build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14
